# Cloudflare Workers project config (static assets, no server code).
#
# There is deliberately no `main` — this is an assets-only Worker, so Cloudflare
# serves dist/ directly off the edge with no script in the request path.
#
# `_headers` in that directory still applies; it is what restores the COOP/COEP
# pair that vite.config.js only sets for the dev server. Worth verifying on the
# live site after the first deploy, because losing it degrades inference to
# single-threaded WASM silently rather than failing.

name = "scriptreader"
compatibility_date = "2026-08-10"

[assets]
directory = "./dist"
